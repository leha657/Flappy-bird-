<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Bird</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-wrapper">
      <div class="hud">
        <span id="score">0</span>
        <span class="coins" id="coins">Coins: 0</span>
        <span class="best" id="best-score">Best: 0</span>
      </div>
      <button class="hud-button" id="open-shop" type="button">Shop</button>
      <canvas id="game" width="360" height="640" aria-label="Flappy bird game"></canvas>
      <div class="overlay" id="overlay">
        <h1 id="title">Flappy Bird</h1>
        <p id="subtitle">Tap, click, or press space to start</p>
        <div class="overlay-actions">
          <button id="start-game" type="button">Start</button>
          <button id="open-shop-overlay" type="button">Shop</button>
        </div>
      </div>
      <div class="easter-egg" id="easter-egg">Golden Flight!</div>
      <div class="toast" id="toast"></div>
      <section class="shop" id="shop" aria-label="Skin shop">
        <div class="shop-card">
          <header>
            <h2>Skin Shop</h2>
            <p>Buy and equip skins. Hitboxes stay the same.</p>
          </header>
          <div class="shop-tabs" role="tablist">
            <button class="active" data-tab="bird" type="button">Bird Skins</button>
            <button data-tab="pipes" type="button">Pipe Skins</button>
          </div>
          <div class="shop-content" id="shop-content"></div>
          <footer>
            <button id="close-shop" type="button">Close</button>
          </footer>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
